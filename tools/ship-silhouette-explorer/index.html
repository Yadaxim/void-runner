<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ship Silhouette Explorer</title>
  <style>
    :root {
      --bg: #080810;
      --panel: #12121c;
      --border: #2a2a40;
      --text: #e8e8f0;
      --muted: #6060a0;
      --accent: #40c0ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .size-tier-toggle {
      display: flex;
      gap: 4px;
      margin-right: 8px;
    }
    .size-tier-toggle button {
      font-family: inherit;
      font-size: 0.75rem;
      padding: 4px 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
    }
    .size-tier-toggle button.active {
      color: var(--accent);
      border-color: var(--accent);
    }
    .tier-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: #1a2a3a;
      color: var(--accent);
      border: 1px solid #2a4a6a;
    }
    .tabs { display: flex; gap: 4px; }
    .tabs button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .tabs button.active {
      color: var(--text);
      border-color: var(--accent);
      background: #0a1a28;
    }
    main {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    .view { display: none; flex: 1; min-height: 0; }
    .view.active { display: flex; }
    #editor-view {
      flex-direction: row;
      min-height: 0;
      overflow: hidden;
      align-items: stretch;
    }
    #gallery-view { flex-direction: column; padding: 12px; overflow: auto; min-height: 0; }
    .canvas-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px 16px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      position: sticky;
      top: 0;
      align-self: flex-start;
      max-height: 100%;
    }
    .editor-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .editor-toolbar, .zoom-bar {
      display: flex;
      gap: 4px;
      align-items: center;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .editor-toolbar button, .zoom-bar button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .editor-toolbar button.active, .zoom-bar button.active {
      color: var(--accent);
      border-color: var(--accent);
    }
    canvas {
      background: #0a0a12;
      border-radius: 12px;
      border: 1px solid var(--border);
      max-width: 100%;
    }
    #editor-canvas { max-width: min(100%, 520px); max-height: min(80vh, 520px); }
    #gallery-canvas { max-width: none; }
    aside {
      width: 320px;
      flex-shrink: 0;
      min-height: 0;
      align-self: stretch;
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px;
      background: var(--panel);
      font-size: 0.8rem;
    }
    aside h2 {
      margin: 0 0 8px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .section { margin-bottom: 16px; }
    label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      color: #b0b0d0;
    }
    label span.val {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      color: var(--accent);
      min-width: 48px;
      text-align: right;
    }
    input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
    select, input[type="number"], input[type="text"], textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    textarea { font-family: "IBM Plex Mono", monospace; font-size: 0.65rem; min-height: 72px; resize: vertical; }
    .row { display: flex; gap: 6px; margin-bottom: 8px; }
    .row button {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .row button:hover { border-color: var(--accent); }
    .checks { display: flex; flex-wrap: wrap; gap: 8px 12px; }
    .checks label { font-size: 0.75rem; margin: 0; }
    .checks input { margin-right: 4px; }
    .wing-block {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 10px;
    }
    .wing-block h3 { margin: 0 0 8px; font-size: 0.75rem; color: var(--accent); }
    #gallery-canvas {
      display: block;
    }
    .gallery-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .gallery-hitbox-toggle {
      font-size: 0.75rem;
      color: #b0b0d0;
      margin: 0;
    }
    .gallery-hitbox-toggle input { margin-right: 4px; }
    .style-filter-group {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      font-size: 0.75rem;
      color: #b0b0d0;
    }
    .body-filter-group label { margin: 0; }
    .style-filter-hint {
      font-size: 0.7rem;
      color: var(--muted);
    }
    .hint { font-size: 0.7rem; color: var(--muted); line-height: 1.4; margin-top: 4px; }
    .zone-presets { display: flex; gap: 4px; margin-bottom: 8px; }
    .zone-presets button {
      flex: 1;
      font-size: 0.7rem;
      padding: 4px 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      cursor: pointer;
    }
    .zone-presets button.active {
      color: var(--accent);
      border-color: var(--accent);
    }
    .zone-derived { font-size: 0.7rem; color: var(--muted); margin: -4px 0 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>Ship Silhouette Explorer</h1>
    <span class="size-tier-toggle" id="size-tier-toggle">
      <button type="button" data-tier="tiny">Tiny</button>
      <button type="button" data-tier="small" class="active">Small</button>
    </span>
    <span class="tier-badge" id="tier-badge">Small — 40×24 px hitbox</span>
    <div class="tabs">
      <button type="button" class="active" data-tab="editor">Editor</button>
      <button type="button" data-tab="gallery">Gallery</button>
    </div>
  </header>

  <main>
    <div id="editor-view" class="view active">
      <div class="canvas-wrap">
        <div class="editor-stage">
          <div class="editor-toolbar">
            <span>Preview zoom</span>
            <button type="button" class="editor-zoom" data-zoom="1">1×</button>
            <button type="button" class="editor-zoom active" data-zoom="2">2×</button>
            <button type="button" class="editor-zoom" data-zoom="3">3×</button>
          </div>
          <canvas id="editor-canvas" width="520" height="520"></canvas>
        </div>
      </div>
      <aside id="controls"></aside>
    </div>

    <div id="gallery-view" class="view">
      <div class="gallery-bar">
        <label>Gallery seed <input type="number" id="gallery-seed" value="42" style="width:100px"></label>
        <label>Per type <input type="number" id="gallery-variants" value="12" min="4" max="24" style="width:52px"></label>
        <button type="button" id="gallery-random">Random seed</button>
        <button type="button" id="gallery-open-editor">Open in editor</button>
        <label class="gallery-hitbox-toggle"><input type="checkbox" id="gallery-show-bbox" checked> Hitbox</label>
        <span class="style-filter-group" id="gallery-style-filters"></span>
        <span class="hint" id="gallery-hint">One row per body type · click a ship to edit it</span>
      </div>
      <canvas id="gallery-canvas"></canvas>
    </div>
  </main>

  <script src="silhouette-core.js"></script>
  <script>
    const C = SilhouetteCore;
    let currentTier = C.SIZE_TIER_SMALL;

    function getTier() {
      return currentTier;
    }

    function updateTierBadge() {
      const t = getTier();
      const badge = document.getElementById('tier-badge');
      if (badge) {
        badge.textContent = `${t.label} — ${t.targetLength}×${t.targetWidth} px hitbox`;
      }
      const hint = document.getElementById('gallery-hint');
      if (hint) {
        const wingNote = C.isVoidOnlyFilters(getStyleFilters())
          ? 'no wings'
          : `${t.id === 'tiny' ? '1–2' : '2–3'} wing pairs`;
        hint.textContent = `One row per body type · click a ship to edit it · ${t.targetLength}×${t.targetWidth} px · ${wingNote}`;
      }
    }

    function syncWingCountSelect() {
      const wingCountSel = document.getElementById('wing-count-sel');
      const wingSec = document.getElementById('wing-params');
      const voidOnly = C.isVoidOnlyFilters(getStyleFilters());
      if (wingSec) wingSec.classList.toggle('hidden', voidOnly);
      if (!wingCountSel) return;
      const opts = C.wingCountOptionsForTierAndFilters(getTier(), getStyleFilters());
      wingCountSel.innerHTML = '';
      opts.forEach((n) => {
        const o = el('option', { value: String(n) });
        o.textContent = n === 0 ? '0 (void hull)' : String(n);
        wingCountSel.appendChild(o);
      });
      wingCountSel.value = String(C.clampWingCount(config.wings.count, getTier(), getStyleFilters()));
      wingCountSel.disabled = voidOnly;
    }

    function refreshStyleFilterCheckboxes() {
      const f = getStyleFilters();
      document.querySelectorAll('.style-filter-cb').forEach((cb) => {
        const key = cb.dataset.filter;
        cb.checked = !!f[key];
        cb.disabled = !!f.void;
      });
      document.querySelectorAll('.style-filter-void-cb').forEach((cb) => {
        cb.checked = !!f.void;
      });
      document.querySelectorAll('.style-filter-hint').forEach((node) => {
        const mode = C.styleModeFromFilters(f);
        node.textContent = mode === 'none' ? 'none' : mode.charAt(0).toUpperCase() + mode.slice(1);
      });
    }

    function onStyleFiltersChanged() {
      styleFilters = C.normalizeStyleFilters(styleFilters);
      config = C.normalizeConfig(config, getTier());
      refreshStyleFilterCheckboxes();
      syncWingCountSelect();
      syncControls();
      redrawEditor();
      redrawGallery();
    }

    function setSizeTier(tierId) {
      currentTier = C.getSizeTier(tierId);
      document.querySelectorAll('#size-tier-toggle button').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.tier === tierId);
      });
      const coh = config.wings?.coherence ?? 0.75;
      config = C.configFromSeed(
        config.seed,
        config.bodyType,
        config.cellIndex ?? 0,
        currentTier,
        getStyleFilters(),
        coh
      );
      config.styleFilters = { ...getStyleFilters() };
      updateTierBadge();
      syncWingCountSelect();
      syncControls();
      redrawEditor();
      redrawGallery();
    }

    document.querySelectorAll('#size-tier-toggle button').forEach((btn) => {
      btn.addEventListener('click', () => setSizeTier(btn.dataset.tier));
    });

    const BODY_PARAM_DEFS = {
      lens: [
        { key: 'len', label: 'Length', min: 20, max: 50, step: 0.5 },
        { key: 'w', label: 'Half-width', min: 6, max: 22, step: 0.5 },
        { key: 'bulge', label: 'Bulge peak', min: 0.15, max: 0.85, step: 0.01 },
      ],
      spade: [
        { key: 'len', label: 'Length', min: 20, max: 50, step: 0.5 },
        { key: 'w', label: 'Stern half-width', min: 6, max: 22, step: 0.5 },
        { key: 'bulge', label: 'Curve peak (nose→stern)', min: 0.15, max: 0.9, step: 0.01 },
        { key: 'bowl', label: 'Bowl (+ out, − in)', min: -1.1, max: 0.6, step: 0.02 },
        { key: 'flatFrac', label: 'Flat stern fraction (0 = arrowhead)', min: 0, max: 0.28, step: 0.01 },
      ],
      facet: [
        { key: 'len', label: 'Length', min: 20, max: 50, step: 0.5 },
        { key: 'w', label: 'Stern half-width', min: 6, max: 22, step: 0.5 },
        { key: 'bulge', label: 'Corner 1 along hull', min: 0.1, max: 0.75, step: 0.01 },
        { key: 'bowl', label: 'Corner 1 (+ out, − in)', min: -1.1, max: 0.6, step: 0.02 },
        { key: 'bulge2', label: 'Corner 2 along hull', min: 0.2, max: 0.95, step: 0.01 },
        { key: 'bowl2', label: 'Corner 2 (+ out, − in)', min: -1.1, max: 0.6, step: 0.02 },
        { key: 'flatFrac', label: 'Flat stern fraction (0 = arrowhead)', min: 0, max: 0.28, step: 0.01 },
      ],
      dart: [
        { key: 'len', label: 'Length', min: 24, max: 58, step: 0.5 },
        { key: 'w', label: 'Max half-width', min: 4, max: 14, step: 0.5 },
        { key: 'waistFrac', label: 'Waist position', min: 0.2, max: 0.65, step: 0.01 },
        { key: 'waistRatio', label: 'Waist width ratio', min: 0.4, max: 0.95, step: 0.01 },
      ],
      rect: [
        { key: 'w', label: 'Width', min: 10, max: 30, step: 0.5 },
        { key: 'h', label: 'Height', min: 18, max: 52, step: 0.5 },
        { key: 'rad', label: 'Corner radius', min: 0, max: 12, step: 0.5 },
        { key: 'taper', label: 'Nose taper', min: 0, max: 0.45, step: 0.01 },
      ],
      trapezoid: [
        { key: 'h', label: 'Height', min: 14, max: 48, step: 0.5 },
        { key: 'noseW', label: 'Nose width', min: 4, max: 20, step: 0.5 },
        { key: 'tailW', label: 'Tail width', min: 14, max: 44, step: 0.5 },
      ],
      polygon: [
        { key: 'sides', label: 'Sides', type: 'select', options: [4, 5, 6, 7, 8].map((n) => ({ v: n, l: String(n) })) },
        { key: 'rad', label: 'Radius', min: 10, max: 30, step: 0.5 },
        { key: 'stretch', label: 'Y stretch', min: 0.7, max: 1.6, step: 0.01 },
      ],
      larva: [
        { key: 'len', label: 'Length', min: 24, max: 58, step: 0.5 },
        { key: 'w', label: 'Lobe half-width', min: 4, max: 16, step: 0.5 },
        { key: 'lobes', label: 'Lobe count', min: 1.5, max: 6, step: 0.1 },
        { key: 'lobeDepth', label: 'Segment pinch', min: 0.05, max: 0.65, step: 0.01 },
        { key: 'taper', label: 'End taper', min: 0.4, max: 1.2, step: 0.02 },
        { key: 'phase', label: 'Phase', min: 0, max: 1, step: 0.01 },
      ],
      orb: [
        { key: 'rad', label: 'Radius', min: 10, max: 28, step: 0.5 },
        { key: 'w', label: 'Half-width', min: 6, max: 20, step: 0.5 },
        { key: 'stretch', label: 'Y stretch', min: 0.75, max: 1.35, step: 0.01 },
      ],
      ameba: [
        { key: 'rad', label: 'Radius', min: 8, max: 24, step: 0.5 },
        { key: 'points', label: 'Star points (0 = blob)', min: 0, max: 8, step: 1 },
        { key: 'spike', label: 'Star depth', min: 0, max: 0.5, step: 0.01 },
        { key: 'wobble', label: 'Wobble', min: 0, max: 0.45, step: 0.01 },
        { key: 'phase', label: 'Rotation', min: 0, max: 1, step: 0.01 },
      ],
    };

    const WING_DETAIL_DEFS = {
      swept: [
        { key: 'tipLead', label: 'Tip lead chord', min: 0.02, max: 0.4, step: 0.01 },
        { key: 'tipTrail', label: 'Tip trail chord', min: 0.02, max: 0.35, step: 0.01 },
      ],
      rect: [{ key: 'tipChord', label: 'Tip chord scale', min: 0.4, max: 1.1, step: 0.01 }],
      blade: [{ key: 'bladeWidth', label: 'Blade width (× chord)', min: 0.08, max: 0.45, step: 0.01 }],
      insect: [
        { key: 'fSpan', label: 'Forward span', min: 0.55, max: 1.05, step: 0.01 },
        { key: 'sizeRatio', label: 'Rear / forward span', min: 0.3, max: 0.85, step: 0.01 },
        { key: 'pitchF', label: 'Forward pitch (nose)', min: 0.05, max: 0.45, step: 0.01 },
        { key: 'pitchR', label: 'Rear pitch (tail)', min: 0.05, max: 0.5, step: 0.01 },
        { key: 'bulge', label: 'Outer bulge', min: 0.05, max: 0.6, step: 0.01 },
        { key: 'bulgeX', label: 'Bulge along span', min: 0.2, max: 0.75, step: 0.01 },
      ],
      tentacle: [
        { key: 'waveAmp', label: 'Wave amplitude', min: 0.1, max: 1.5, step: 0.01 },
        { key: 'waves', label: 'Wave count', min: 0.8, max: 8, step: 0.1 },
        { key: 'phase', label: 'Wave phase', type: 'select', options: [{ v: 0, l: '0 — drape tail' }, { v: 1, l: '1 — drape nose' }] },
        { key: 'decay', label: 'Wave decay', min: 0.6, max: 4, step: 0.05 },
        { key: 'w0', label: 'Base thickness', min: 0.08, max: 0.5, step: 0.01 },
        { key: 'w1Ratio', label: 'Tip thickness', min: 0.02, max: 1.65, step: 0.01 },
        { key: 'bulb', label: 'Tip bulb', min: 0, max: 0.3, step: 0.01 },
      ],
      lobe: [
        { key: 'bulgeX', label: 'Bulge X frac', min: 0.15, max: 0.85, step: 0.01 },
        { key: 'bulgeTop', label: 'Bulge top', min: 0.4, max: 1.6, step: 0.01 },
        { key: 'bulgeBot', label: 'Bulge bottom', min: 0.2, max: 1.1, step: 0.01 },
      ],
      node: [
        { key: 'count', label: 'Orb count', min: 1, max: 6, step: 1 },
        { key: 'nodeRad', label: 'Orb radius', min: 0.15, max: 0.8, step: 0.01 },
        { key: 'arcRadius', label: 'Arc radius scale', min: 1, max: 2, step: 0.01 },
        { key: 'arcSpread', label: 'Arc spread', min: 0.25, max: 1.05, step: 0.01 },
      ],
      halo: [
        { key: 'count', label: 'Arc count', min: 1, max: 6, step: 1 },
        { key: 'baseRadius', label: 'Inner radius scale', min: 1, max: 2, step: 0.01 },
        { key: 'radiusStep', label: 'Ring spacing', min: 0.04, max: 0.22, step: 0.01 },
        { key: 'lineThick', label: 'Arc thickness', min: 0.015, max: 0.09, step: 0.005 },
        { key: 'arcSpan', label: 'Arc span (semicircle)', min: 0.35, max: 1.05, step: 0.01 },
        { key: 'centerYOffset', label: 'Center Y offset', min: -0.12, max: 0.12, step: 0.01 },
      ],
    };

    let config = C.defaultShipConfig('lens');
    let styleFilters = C.defaultStyleFilters();
    let editorZoom = 2;
    let drawOptions = {
      showBody: true,
      showWings: true,
      showWidthAt: true,
      showAttach: true,
      showBBox: true,
      alignWingsToHull: true,
    };

    const editorCanvas = document.getElementById('editor-canvas');
    const editorCtx = editorCanvas.getContext('2d');
    const galleryCanvas = document.getElementById('gallery-canvas');
    const galleryCtx = galleryCanvas.getContext('2d');
    const controlsEl = document.getElementById('controls');

    function getStyleFilters() {
      return styleFilters;
    }

    function setStyleFilters(next) {
      styleFilters = C.normalizeStyleFilters(next);
      config.styleFilters = { ...styleFilters };
      refreshStyleFilterCheckboxes();
    }

    function bodyTypesForCurrentFilters() {
      return C.bodyTypesForFilters(getStyleFilters());
    }

    function mountStyleFilterCheckboxes(container, onChange) {
      container.innerHTML = '';
      container.appendChild(document.createTextNode('Style '));
      ['organic', 'inorganic', 'energy'].forEach((key) => {
        const lb = el('label');
        const cb = el('input', { type: 'checkbox', className: 'style-filter-cb' });
        cb.dataset.filter = key;
        cb.checked = styleFilters[key];
        cb.addEventListener('change', () => {
          if (getStyleFilters().void) return;
          const next = { ...getStyleFilters(), [key]: cb.checked, void: false };
          if (!next.organic && !next.inorganic && !next.energy) {
            cb.checked = true;
            return;
          }
          setStyleFilters(next);
          if (onChange) onChange();
          else onStyleFiltersChanged();
        });
        lb.appendChild(cb);
        lb.appendChild(document.createTextNode(` ${key.charAt(0).toUpperCase()}${key.slice(1)}`));
        container.appendChild(lb);
      });
      const voidLb = el('label');
      const voidCb = el('input', { type: 'checkbox', className: 'style-filter-void-cb' });
      voidCb.checked = !!styleFilters.void;
      voidCb.addEventListener('change', () => {
        if (voidCb.checked) {
          setStyleFilters({ void: true });
        } else {
          setStyleFilters({ organic: true, inorganic: true, energy: false, void: false });
        }
        if (onChange) onChange();
        else onStyleFiltersChanged();
      });
      voidLb.appendChild(voidCb);
      voidLb.appendChild(document.createTextNode(' Void'));
      container.appendChild(voidLb);
      const hint = el('span', { className: 'style-filter-hint' });
      hint.textContent = C.styleModeFromFilters(styleFilters);
      container.appendChild(hint);
      refreshStyleFilterCheckboxes();
    }

    function shapesForCurrentStyleFilters() {
      return C.wingShapesForFilters(getStyleFilters());
    }

    function galleryCellIndex(bodyType, variantIdx) {
      const typeIdx = C.BODY_TYPES.indexOf(bodyType);
      return typeIdx * 100 + variantIdx;
    }
    const GALLERY_CELL_W = 100;
    const GALLERY_CELL_H = 96;
    const GALLERY_COL_GAP = 16;
    const GALLERY_ROW_LABEL_W = 52;
    const GALLERY_ROW_GAP = 8;

    function getDrawOptions() {
      return {
        ...drawOptions,
        viewZoom: editorZoom,
        fillStyle: '#c8d8f0',
        strokeStyle: '#8aabcc',
        lineWidth: 0.8,
      };
    }

    function getGalleryDrawOptions() {
      const bboxCb = document.getElementById('gallery-show-bbox');
      return {
        ...getDrawOptions(),
        fitToHitbox: true,
        pixelSnap: true,
        viewZoom: 1,
        lineWidth: 1,
        showWidthAt: false,
        showAttach: false,
        showBBox: bboxCb ? bboxCb.checked : drawOptions.showBBox,
      };
    }

    function galleryVariantCount() {
      return Math.min(
        24,
        Math.max(4, Number(document.getElementById('gallery-variants').value) || 12)
      );
    }

    function galleryHitTest(canvasX, canvasY) {
      const variants = galleryVariantCount();
      const bodyTypes = bodyTypesForCurrentFilters();
      const typeCount = bodyTypes.length;
      if (typeCount === 0) return null;
      const rowStride = GALLERY_CELL_H + GALLERY_ROW_GAP;
      if (canvasX < GALLERY_ROW_LABEL_W) return null;
      const col = Math.floor((canvasX - GALLERY_ROW_LABEL_W) / (GALLERY_CELL_W + GALLERY_COL_GAP));
      if (col < 0 || col >= variants) return null;
      const cellX0 = GALLERY_ROW_LABEL_W + col * (GALLERY_CELL_W + GALLERY_COL_GAP);
      if (canvasX >= cellX0 + GALLERY_CELL_W) return null;
      const row = Math.floor(canvasY / rowStride);
      if (row < 0 || row >= typeCount) return null;
      const rowY = row * rowStride;
      if (canvasY >= rowY + GALLERY_CELL_H) return null;
      return { typeIdx: row, variantIdx: col, bodyType: bodyTypes[row] };
    }

    function openGalleryCell(hit) {
      const seed = Number(document.getElementById('gallery-seed').value) || 1;
      config = C.sampleShipConfig(
        seed,
        hit.bodyType,
        getTier(),
        galleryCellIndex(hit.bodyType, hit.variantIdx),
        getStyleFilters()
      );
      config.styleFilters = { ...getStyleFilters() };
      const seedIn = document.getElementById('seed-input');
      if (seedIn) seedIn.value = config.seed;
      document.querySelector('[data-tab="editor"]').click();
      syncControls();
      redrawEditor();
    }

    function galleryColCenterX(variantIdx) {
      return (
        GALLERY_ROW_LABEL_W +
        variantIdx * (GALLERY_CELL_W + GALLERY_COL_GAP) +
        GALLERY_CELL_W / 2
      );
    }

    function redrawEditor() {
      editorCtx.fillStyle = '#0a0a12';
      editorCtx.fillRect(0, 0, editorCanvas.width, editorCanvas.height);
      C.drawShip(editorCtx, editorCanvas.width / 2, editorCanvas.height / 2, config, getDrawOptions());
      const jsonTa = document.getElementById('config-json');
      if (jsonTa && document.activeElement !== jsonTa) {
        jsonTa.value = JSON.stringify(config, null, 2);
      }
    }

    function redrawGallery() {
      const seed = Number(document.getElementById('gallery-seed').value) || 1;
      const variants = galleryVariantCount();
      document.getElementById('gallery-variants').value = String(variants);

      const bodyTypes = bodyTypesForCurrentFilters();
      const typeCount = bodyTypes.length;
      const rowStride = GALLERY_CELL_H + GALLERY_ROW_GAP;
      const gridW = variants * GALLERY_CELL_W + (variants - 1) * GALLERY_COL_GAP;
      const W = GALLERY_ROW_LABEL_W + gridW;
      const H = typeCount * rowStride - GALLERY_ROW_GAP;

      galleryCanvas.width = W;
      galleryCanvas.height = H;
      galleryCanvas.style.width = `${W}px`;
      galleryCanvas.style.height = `${H}px`;
      galleryCtx.imageSmoothingEnabled = true;
      galleryCtx.fillStyle = '#0a0a12';
      galleryCtx.fillRect(0, 0, W, H);

      galleryCtx.font = '11px "IBM Plex Mono", monospace';
      galleryCtx.fillStyle = '#6060a0';
      galleryCtx.textBaseline = 'middle';

      if (typeCount === 0) {
        galleryCtx.fillStyle = '#6060a0';
        galleryCtx.fillText('Select at least one style (organic / inorganic / energy / void).', 12, 24);
        return;
      }

      bodyTypes.forEach((bodyType, typeIdx) => {
        const rowY = typeIdx * rowStride;
        const rowMidY = rowY + GALLERY_CELL_H / 2;

        if (typeIdx > 0) {
          galleryCtx.strokeStyle = '#1e1e30';
          galleryCtx.lineWidth = 1;
          galleryCtx.beginPath();
          galleryCtx.moveTo(0, rowY - GALLERY_ROW_GAP / 2);
          galleryCtx.lineTo(W, rowY - GALLERY_ROW_GAP / 2);
          galleryCtx.stroke();
        }

        galleryCtx.fillStyle = '#6060a0';
        galleryCtx.fillText(bodyType, 8, rowMidY);

        for (let v = 0; v < variants; v++) {
          const cellIndex = galleryCellIndex(bodyType, v);
          const cellConfig = C.sampleShipConfig(seed, bodyType, getTier(), cellIndex, getStyleFilters());
          C.drawShip(
            galleryCtx,
            galleryColCenterX(v),
            rowMidY,
            cellConfig,
            getGalleryDrawOptions()
          );
        }
      });
    }

    function el(tag, attrs, children) {
      const n = document.createElement(tag);
      if (attrs) Object.entries(attrs).forEach(([k, v]) => {
        if (k === 'className') n.className = v;
        else if (k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), v);
        else n[k] = v;
      });
      (children || []).forEach((c) => n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
      return n;
    }

    function sliderDecimals(step) {
      const s = step ?? 0.01;
      if (s >= 1) return 0;
      if (s >= 0.1) return 1;
      return 2;
    }

    function formatSliderValue(val, step) {
      const n = Number(val);
      if (!Number.isFinite(n)) return '—';
      return n.toFixed(sliderDecimals(step));
    }

    function bindParam(obj, key, def, onChange) {
      const wrap = el('label');
      wrap.appendChild(document.createTextNode(def.label));
      const valSpan = el('span', { className: 'val' });
      const step = def.step ?? 0.01;
      valSpan.textContent = formatSliderValue(obj[key] ?? def.min ?? 0, step);
      wrap.appendChild(valSpan);

      if (def.type === 'select') {
        const sel = el('select');
        def.options.forEach((o) => {
          const opt = el('option', { value: String(o.v) });
          opt.textContent = o.l;
          if (Number(obj[key]) === o.v || obj[key] === o.v) opt.selected = true;
          sel.appendChild(opt);
        });
        sel.addEventListener('change', () => {
          const opt = def.options.find((o) => String(o.v) === sel.value);
          obj[key] = opt ? opt.v : sel.value;
          valSpan.textContent = String(obj[key]);
          onChange();
        });
        wrap.appendChild(sel);
      } else {
        const input = el('input', { type: 'range', min: def.min, max: def.max, step, value: obj[key] });
        input.addEventListener('input', () => {
          const decimals = sliderDecimals(step);
          obj[key] = Number(Number(input.value).toFixed(decimals));
          valSpan.textContent = formatSliderValue(obj[key], step);
          onChange();
        });
        wrap.insertBefore(input, valSpan);
      }
      return wrap;
    }

    function ensureWingDetail(pair) {
      if (!pair.detail) pair.detail = {};
      const defs = WING_DETAIL_DEFS[pair.shape] || [];
      defs.forEach((d) => {
        if (pair.detail[d.key] == null) pair.detail[d.key] = (d.min + d.max) / 2;
      });
    }

    function buildControls() {
      controlsEl.innerHTML = '';

      const seedSec = el('div', { className: 'section' });
      seedSec.appendChild(el('h2', null, ['Seed & type']));
      const seedRow = el('div', { className: 'row' });
      const seedInput = el('input', { type: 'number', id: 'seed-input', value: config.seed });
      seedRow.appendChild(seedInput);
      const applySeedBtn = el('button', { type: 'button', textContent: 'Apply seed' });
      applySeedBtn.addEventListener('click', () => {
        const coh = config.wings?.coherence ?? 0.75;
        config = C.configFromSeed(Number(seedInput.value) || 1, config.bodyType, 0, getTier(), getStyleFilters(), coh);
        syncControls();
        redrawEditor();
      });
      seedRow.appendChild(applySeedBtn);
      const randomSeedBtn = el('button', { type: 'button', textContent: 'Random' });
      randomSeedBtn.addEventListener('click', () => {
        seedInput.value = Math.floor(Math.random() * 100000);
        const coh = config.wings?.coherence ?? 0.75;
        config = C.configFromSeed(Number(seedInput.value), config.bodyType, 0, getTier(), getStyleFilters(), coh);
        syncControls();
        redrawEditor();
      });
      seedRow.appendChild(randomSeedBtn);
      seedSec.appendChild(seedRow);
      const styleFilterWrap = el('div', { className: 'checks style-filter-group', id: 'editor-style-filters' });
      mountStyleFilterCheckboxes(styleFilterWrap, onStyleFiltersChanged);
      seedSec.appendChild(styleFilterWrap);
      seedSec.appendChild(el('p', { className: 'hint' }, [
        'Organic, inorganic, and energy combine freely. Void is standalone (ameba hull, no wings) — matches void techArchetype.',
      ]));

      const typeSel = el('select', { id: 'body-type-sel' });
      function fillBodyTypeSelect() {
        const allowed = bodyTypesForCurrentFilters();
        const cur = config.bodyType;
        typeSel.innerHTML = '';
        allowed.forEach((t) => {
          const o = el('option', { value: t });
          o.textContent = t;
          if (t === cur) o.selected = true;
          typeSel.appendChild(o);
        });
        if (allowed.length && !allowed.includes(cur)) {
          config.bodyType = allowed[0];
          config.body = C.defaultBodyParams(config.bodyType, getTier());
        }
      }
      fillBodyTypeSelect();
      typeSel.addEventListener('change', () => {
        config.bodyType = typeSel.value;
        config.body = C.defaultBodyParams(config.bodyType, getTier());
        config = C.normalizeConfig(config, getTier());
        syncControls();
        redrawEditor();
      });
      seedSec.appendChild(typeSel);
      controlsEl.appendChild(seedSec);

      const debugSec = el('div', { className: 'section' });
      debugSec.appendChild(el('h2', null, ['Debug overlays']));
      const checks = el('div', { className: 'checks' });
      [
        ['showBBox', 'Target hitbox'],
        ['showWidthAt', 'widthAt envelope'],
        ['showAttach', 'Attach points'],
        ['alignWingsToHull', 'Align wings to hull'],
        ['showBody', 'Body'],
        ['showWings', 'Wings'],
      ].forEach(([k, label]) => {
        const lb = el('label');
        const cb = el('input', { type: 'checkbox' });
        cb.dataset.optKey = k;
        cb.checked = drawOptions[k];
        cb.addEventListener('change', () => {
          drawOptions[k] = cb.checked;
          if (k === 'showBBox') {
            const g = document.getElementById('gallery-show-bbox');
            if (g) g.checked = cb.checked;
          }
          redrawEditor();
          redrawGallery();
        });
        lb.appendChild(cb);
        lb.appendChild(document.createTextNode(label));
        checks.appendChild(lb);
      });
      debugSec.appendChild(checks);
      controlsEl.appendChild(debugSec);

      const bodySec = el('div', { className: 'section', id: 'body-params' });
      bodySec.appendChild(el('h2', null, ['Body']));
      controlsEl.appendChild(bodySec);

      const wingSec = el('div', { className: 'section', id: 'wing-params' });
      wingSec.appendChild(el('h2', null, ['Wings']));
      const wingCountLb = el('label');
      wingCountLb.appendChild(document.createTextNode('Pair count'));
      const wingCountSel = el('select', { id: 'wing-count-sel' });
      C.wingCountOptionsForTierAndFilters(getTier(), getStyleFilters()).forEach((n) => {
        const o = el('option', { value: String(n) });
        o.textContent = String(n);
        if (n === config.wings.count) o.selected = true;
        wingCountSel.appendChild(o);
      });
      wingCountLb.appendChild(wingCountSel);
      wingCountSel.addEventListener('change', () => {
        config.wings.count = C.clampWingCount(Number(wingCountSel.value), getTier(), getStyleFilters());
        config = C.normalizeConfig(config, getTier());
        syncControls();
        redrawEditor();
      });
      wingSec.appendChild(wingCountLb);

      const primLb = el('label');
      primLb.appendChild(document.createTextNode('Primary shape'));
      const primSel = el('select', { id: 'primary-shape-sel' });
      shapesForCurrentStyleFilters().forEach((s) => {
        const o = el('option', { value: s });
        o.textContent = s;
        if (s === config.wings.primaryShape) o.selected = true;
        primSel.appendChild(o);
      });
      primSel.addEventListener('change', () => {
        config.wings.primaryShape = primSel.value;
        C.applyPrimaryWingShape(config.wings, {
          allPairs: true,
          seed: config.seed,
          styleFilters: getStyleFilters(),
        });
        syncControls();
        redrawEditor();
      });
      primLb.appendChild(primSel);
      wingSec.appendChild(primLb);

      const cohLb = bindParam(config.wings, 'coherence', {
        label: 'Shape coherence',
        min: 0,
        max: 1,
        step: 0.05,
      }, () => {
        C.applyWingCoherence(config.wings, config.seed, getStyleFilters());
        syncControls();
        redrawEditor();
      });
      wingSec.appendChild(cohLb);
      wingSec.appendChild(
        el('p', { className: 'hint' }, [
          'Primary shape sets the wing family. Apply seed / Random randomize it; coherence mixes other pairs from the pool.',
        ])
      );
      controlsEl.appendChild(wingSec);

      const jsonSec = el('div', { className: 'section' });
      jsonSec.appendChild(el('h2', null, ['Config JSON']));
      const ta = el('textarea', { id: 'config-json' });
      jsonSec.appendChild(ta);
      const jsonRow = el('div', { className: 'row' });
      jsonRow.appendChild(el('button', { type: 'button', textContent: 'Copy' }));
      jsonRow.lastChild.addEventListener('click', () => {
        ta.value = JSON.stringify(config, null, 2);
        navigator.clipboard?.writeText(ta.value);
      });
      jsonRow.appendChild(el('button', { type: 'button', textContent: 'Load' }));
      jsonRow.lastChild.addEventListener('click', () => {
        try {
          config = C.normalizeConfig(JSON.parse(ta.value));
          syncControls();
          redrawEditor();
        } catch (e) {
          alert('Invalid JSON: ' + e.message);
        }
      });
      jsonSec.appendChild(jsonRow);
      jsonSec.appendChild(el('p', { className: 'hint' }, [
        'Same seed or identical JSON → same ship. Paste JSON to restore manually.',
      ]));
      controlsEl.appendChild(jsonSec);

      syncControls();
    }

    function syncControls() {
      const bodySec = document.getElementById('body-params');
      const wingSec = document.getElementById('wing-params');
      if (!bodySec || !wingSec) return;

      if (config.styleFilters || config.bodyFilters) {
        setStyleFilters(config.styleFilters || config.bodyFilters);
      } else config.styleFilters = { ...getStyleFilters() };
      config = C.normalizeConfig(config, getTier());

      const typeSel = document.getElementById('body-type-sel');
      if (typeSel) {
        const allowed = bodyTypesForCurrentFilters();
        const cur = config.bodyType;
        typeSel.innerHTML = '';
        allowed.forEach((t) => {
          const o = el('option', { value: t });
          o.textContent = t;
          if (t === cur) o.selected = true;
          typeSel.appendChild(o);
        });
        if (allowed.length && !allowed.includes(cur)) {
          config.bodyType = allowed[0];
          config.body = C.defaultBodyParams(config.bodyType, getTier());
        }
        typeSel.value = config.bodyType;
      }

      Array.from(bodySec.querySelectorAll('.param')).forEach((n) => n.remove());
      (BODY_PARAM_DEFS[config.bodyType] || []).forEach((def) => {
        const node = bindParam(config.body, def.key, def, redrawEditor);
        node.className = 'param';
        bodySec.appendChild(node);
      });

      Array.from(wingSec.querySelectorAll('.wing-block')).forEach((n) => n.remove());
      config.wings.pairs.forEach((pair, i) => {
        ensureWingDetail(pair);
        const block = el('div', { className: 'wing-block' });
        block.appendChild(el('h3', null, [`Pair ${i + 1}`]));

        const shapeLb = el('label');
        shapeLb.appendChild(document.createTextNode('Shape'));
        const shapeSel = el('select');
        shapesForCurrentStyleFilters().forEach((s) => {
          const o = el('option', { value: s });
          o.textContent = s;
          if (s === pair.shape) o.selected = true;
          shapeSel.appendChild(o);
        });
        shapeSel.addEventListener('change', () => {
          pair.shape = shapeSel.value;
          if (pair.shape === 'tentacle') pair.atEdge = true;
          if (C.isWingEnergy(pair.shape)) pair.atEdge = true;
          ensureWingDetail(pair);
          syncControls();
          redrawEditor();
        });
        shapeLb.appendChild(shapeSel);
        block.appendChild(shapeLb);

        const zoneRow = el('div', { className: 'zone-presets' });
        C.ZONES.forEach((z) => {
          const btn = el('button', { type: 'button', textContent: z.label });
          const mid = (z.lo + z.hi) / 2;
          const active = C.zoneFromAttachFrac(pair.attachFrac ?? 0.5).id === z.id;
          if (active) btn.className = 'active';
          btn.title = `Set attach fraction to ${mid.toFixed(2)} (range ${z.lo}–${z.hi})`;
          btn.addEventListener('click', () => {
            pair.attachFrac = mid;
            syncControls();
            redrawEditor();
          });
          zoneRow.appendChild(btn);
        });
        block.appendChild(zoneRow);

        const derived = C.zoneFromAttachFrac(pair.attachFrac ?? 0.5);
        block.appendChild(
          el('p', { className: 'zone-derived' }, [
            `Along hull: ${((pair.attachFrac ?? 0) * 100).toFixed(0)}% nose→tail · preset band: ${derived.label} (${derived.lo}–${derived.hi})`,
          ])
        );

        [
          { key: 'attachFrac', label: 'Attach fraction (0=nose, 1=tail)', min: 0.05, max: 0.95, step: 0.01 },
          { key: 'spanScale', label: 'Span scale', min: 0.3, max: 3.5, step: 0.05 },
          {
            key: 'chordScale',
            label: 'Chord scale',
            min: 0.05,
            max: pair.shape === 'insect' ? 0.75 : C.isWingEnergy(pair.shape) ? 0.45 : 0.6,
            step: 0.01,
          },
          { key: 'sweep', label: 'Sweep', min: -0.5, max: 0.9, step: 0.02 },
        ].forEach((def) => {
          const onChange = def.key === 'attachFrac' ? () => { syncControls(); redrawEditor(); } : redrawEditor;
          block.appendChild(bindParam(pair, def.key, def, onChange));
        });

        const edgeLb = el('label');
        const edgeCb = el('input', { type: 'checkbox' });
        if (pair.shape === 'tentacle') pair.atEdge = true;
        if (C.isWingEnergy(pair.shape)) pair.atEdge = true;
        edgeCb.checked = pair.atEdge !== false;
        edgeCb.disabled = pair.shape === 'tentacle' || C.isWingEnergy(pair.shape);
        edgeCb.addEventListener('change', () => {
          if (pair.shape === 'tentacle' || C.isWingEnergy(pair.shape)) return;
          pair.atEdge = edgeCb.checked;
          redrawEditor();
        });
        edgeLb.appendChild(edgeCb);
        edgeLb.appendChild(document.createTextNode('Attach at hull edge'));
        block.appendChild(edgeLb);

        (WING_DETAIL_DEFS[pair.shape] || []).forEach((def) =>
          block.appendChild(bindParam(pair.detail, def.key, def, redrawEditor))
        );

        wingSec.appendChild(block);
      });

      const seedIn = document.getElementById('seed-input');
      if (seedIn) seedIn.value = config.seed;
      const wingCountSel = document.getElementById('wing-count-sel');
      syncWingCountSelect();
      const primSel = document.getElementById('primary-shape-sel');
      if (primSel) {
        const allowed = shapesForCurrentStyleFilters();
        const cur = config.wings.primaryShape;
        primSel.innerHTML = '';
        allowed.forEach((s) => {
          const o = el('option', { value: s });
          o.textContent = s;
          primSel.appendChild(o);
        });
        primSel.value = allowed.includes(cur) ? cur : allowed[0];
        if (!allowed.includes(cur)) config.wings.primaryShape = primSel.value;
      }
      const jsonTa = document.getElementById('config-json');
      if (jsonTa) jsonTa.value = JSON.stringify(config, null, 2);
    }

    document.querySelectorAll('.tabs button').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tabs button').forEach((b) => b.classList.remove('active'));
        document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab + '-view').classList.add('active');
        if (btn.dataset.tab === 'gallery') redrawGallery();
        else redrawEditor();
      });
    });

    document.getElementById('gallery-random').addEventListener('click', () => {
      document.getElementById('gallery-seed').value = Math.floor(Math.random() * 100000);
      redrawGallery();
    });
    document.getElementById('gallery-seed').addEventListener('change', redrawGallery);
    document.getElementById('gallery-variants').addEventListener('change', redrawGallery);
    document.getElementById('gallery-show-bbox').addEventListener('change', (e) => {
      drawOptions.showBBox = e.target.checked;
      const editorCb = document.querySelector('[data-opt-key="showBBox"]');
      if (editorCb) editorCb.checked = drawOptions.showBBox;
      redrawGallery();
    });

    galleryCanvas.addEventListener('click', (e) => {
      const rect = galleryCanvas.getBoundingClientRect();
      const scaleX = galleryCanvas.width / rect.width;
      const scaleY = galleryCanvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;
      const hit = galleryHitTest(x, y);
      if (hit) openGalleryCell(hit);
    });

    document.querySelectorAll('.editor-zoom').forEach((btn) => {
      btn.addEventListener('click', () => {
        editorZoom = Number(btn.dataset.zoom) || 1;
        document.querySelectorAll('.editor-zoom').forEach((b) => {
          b.classList.toggle('active', Number(b.dataset.zoom) === editorZoom);
        });
        redrawEditor();
      });
    });
    document.getElementById('gallery-open-editor').addEventListener('click', () => {
      const seed = Number(document.getElementById('gallery-seed').value) || 1;
      config = C.sampleShipConfig(seed, config.bodyType, getTier(), 0, getStyleFilters());
      config.styleFilters = { ...getStyleFilters() };
      document.querySelector('[data-tab="editor"]').click();
      syncControls();
      redrawEditor();
    });

    buildControls();
    currentTier = C.getSizeTier(config.tier || 'small');
    document.querySelectorAll('#size-tier-toggle button').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.tier === currentTier.id);
    });
    updateTierBadge();
    mountStyleFilterCheckboxes(document.getElementById('gallery-style-filters'), onStyleFiltersChanged);
    redrawEditor();
    redrawGallery();
  </script>
</body>
</html>

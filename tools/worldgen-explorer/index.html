<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Void Runner — Worldgen Explorer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <h1>WORLDGEN EXPLORER</h1>
        <span class="badge">standalone · debug</span>
        <button type="button" id="btnRunStep" class="primary" title="Run selected pipeline step, or the next runnable step">
          Run step
        </button>
        <button type="button" id="btnGenerate" title="Continue from the first pending or failed step">
          Continue pipeline
        </button>
        <label class="file-btn">
          Load world JSON
          <input type="file" id="fileWorld" accept=".json,application/json" />
        </label>
        <label class="file-btn">
          Load checkpoint
          <input type="file" id="fileCheckpoint" accept=".json,application/json" />
        </label>
        <button type="button" id="btnExportCheckpoint">Export checkpoint</button>
        <button type="button" id="btnReset">Reset</button>
      </header>

      <aside class="panel left" id="configPanel">
        <div class="panel-header" id="configPanelTitle">Step 1 — Galaxy structure</div>
        <div class="panel-scroll" id="configForm"></div>
      </aside>

      <main class="map-wrap">
        <canvas id="galaxyCanvas"></canvas>
        <div class="map-hint">Arrows · click sector · double-click pipeline step to run it</div>
      </main>

      <aside class="panel inspect">
        <div class="panel-header">Selected sector</div>
        <div class="panel-scroll" id="sectorInspect"></div>
      </aside>

      <aside class="panel right">
        <div class="panel-header">Pipeline</div>
        <div class="panel-scroll pipeline-scroll">
          <ul class="step-list" id="stepList"></ul>
        </div>
        <div class="panel-header step-output-header">
          <span>Step output</span>
          <span class="output-tabs">
            <button type="button" class="output-tab active" data-output-mode="preview">Preview</button>
            <button type="button" class="output-tab" data-output-mode="json">Raw JSON</button>
          </span>
        </div>
        <div class="panel-scroll panel-scroll-grow step-output-body">
          <div id="stepOutputPreview" class="step-output-preview"></div>
          <pre class="json-preview" id="stepJson" hidden>Select a pipeline step</pre>
        </div>
      </aside>

      <footer class="log-panel">
        <div class="panel-header">Log</div>
        <div class="log-scroll" id="logView"></div>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
